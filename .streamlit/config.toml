# Look: ink on paper, in the manner of a printed physiology monograph.
# One accent colour (a dark brick red), a serif for reading, a monospace for data.
# The rest of the styling — rules instead of boxes, small-caps labels, the ledger and
# bibliography layouts — is in kod/style.py.
#
# The app is always light: the palette, the charts and the D3 diagram are drawn for a
# paper background. This overrides a visitor's dark-mode preference.

[theme]
base = "light"

primaryColor = "#8c2f1b"              # the one accent
backgroundColor = "#faf7f0"           # paper
secondaryBackgroundColor = "#f1ecdf"  # inputs, table headers
textColor = "#1d1b18"                 # ink
linkColor = "#8c2f1b"
linkUnderline = true
borderColor = "#d6cebc"
showWidgetBorder = true
showSidebarBorder = true

baseRadius = "2px"
buttonRadius = "2px"

# Typefaces: the serif and the mono that Streamlit itself ships (Source Serif, Source Code
# Pro). Nothing is fetched from a third party, so the page reads the same in every browser,
# offline, and behind a content blocker. (Until 2026-10 the fonts came from Google Fonts
# through a font string whose fallbacks were not honoured: when the request failed, the
# whole site fell back to a sans-serif.)
font = "serif"
headingFont = "serif"
codeFont = "monospace"
baseFontSize = 17
codeFontSize = "0.84rem"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.5rem", "1.85rem", "1.3rem", "1.1rem", "1rem", "0.95rem"]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 500

codeTextColor = "#5b2a1c"
codeBackgroundColor = "#f1ecdf"

# Notices (st.info / st.success / st.warning / st.error): quiet tints of the paper,
# told apart by a rule and a small-caps label, not by a coloured box.
blueBackgroundColor = "#f3f0e7"
blueTextColor = "#1d1b18"
greenBackgroundColor = "#f3f0e7"
greenTextColor = "#1d1b18"
yellowBackgroundColor = "#f6efdc"
yellowTextColor = "#1d1b18"
redBackgroundColor = "#f6e9e3"
redTextColor = "#1d1b18"

dataframeBorderColor = "#d6cebc"
dataframeHeaderBackgroundColor = "#f1ecdf"
dataframeHeaderTextColor = "#5f584c"

[theme.sidebar]
backgroundColor = "#f3eee3"
secondaryBackgroundColor = "#faf7f0"
borderColor = "#d6cebc"

# No "Deploy" button and no developer menu: this is a published site, not a notebook.
[client]
toolbarMode = "minimal"
