<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow: hidden; }   /* the frame is sized to fit; no inner scrollbar */
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: transparent; }

    #main-container { display: flex; flex-direction: column; width: 100%; height: 850px; overflow: hidden; }
    #diagram-panel {
      width: 100%; flex: 1; overflow: hidden;
      transition: flex 0.5s ease;
    }
    #diagram-panel.shrunk { flex: 0.62; }
    #diagram-panel svg { width: 100%; height: 100%; }
    #chart-panel {
      width: 100%; flex: 0; overflow: hidden; opacity: 0;
      transition: flex 0.5s ease, opacity 0.4s ease, padding 0.4s ease;
      border-top: 2px solid #e5e7eb; background: rgba(250,250,250,0.95);
      padding: 0 14px;
    }
    #chart-panel.open { flex: 0.38; opacity: 1; padding: 8px 14px 10px; overflow: visible; }
    #chart-panel .chart-header {
      padding: 2px 0 4px; font-size: 12px; font-weight: 600; color: #374151;
      display: flex; justify-content: space-between; align-items: center;
    }
    #chart-panel .chart-hint {
      padding: 4px 0; font-size: 11px; color: #9ca3af; font-style: italic;
    }

    #controls {
      position: absolute; top: 8px; right: 8px; z-index: 50;
      display: flex; gap: 6px;
    }
    .ctrl-btn {
      padding: 6px 12px; font-size: 11px; font-weight: 600; cursor: pointer;
      background: #1e3a8a; color: white; border: none; border-radius: 6px;
      transition: background 0.2s; letter-spacing: 0.02em;
    }
    .ctrl-btn:hover { background: #1e40af; }
    .ctrl-btn.alt { background: #475569; }
    .ctrl-btn.alt:hover { background: #334155; }

    .tooltip {
      position: absolute; text-align: left; padding: 10px 14px; font-size: 12px;
      background: rgba(255,255,255,0.97); border: 1px solid #d1d5db; border-radius: 8px;
      pointer-events: none; opacity: 0; z-index: 100;
      box-shadow: 0 8px 25px -5px rgba(0,0,0,0.12), 0 4px 10px -5px rgba(0,0,0,0.06);
      transition: opacity 0.15s ease; max-width: 260px; line-height: 1.5;
    }
    .tooltip .tt-title { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
    .tooltip .tt-label { color: #6b7280; }
    .tooltip .tt-val { font-weight: 600; color: #1e3a8a; }
    .tooltip hr { border: none; border-top: 1px solid #e5e7eb; margin: 5px 0; }

    .segment-path { cursor: pointer; transition: filter 0.2s, opacity 0.2s; }
    .segment-path:hover { filter: brightness(0.85) drop-shadow(0 0 6px rgba(0,0,0,0.25)); }

    .zone-label {
      font-size: 11px; fill: #9ca3af; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
    }
    .seg-label { font-size: 10px; fill: #374151; font-weight: 600; letter-spacing: 0.03em; }
    .osm-label { font-size: 10px; fill: #92400e; font-weight: 500; }
    .legend-title { font-size: 11px; fill: #374151; font-weight: 600; }
    .legend-tick { font-size: 10px; fill: #6b7280; }
    .glom-label { font-size: 11px; fill: #991b1b; font-weight: 700; }
    .md-label { font-size: 10px; fill: #7c2d12; font-weight: 700; }
    .tgf-label { font-size: 9px; fill: #b91c1c; font-weight: 600; letter-spacing: 0.05em; }
    .particle { pointer-events: none; }
  </style>
</head>
<body>
  <div style="position:relative;">
    <div id="controls">
      <button id="mode-btn" class="ctrl-btn">Color: Concentration</button>
      <button id="flow-btn" class="ctrl-btn alt">Flow: On</button>
      <button id="toggle-chart-btn" class="ctrl-btn">Open chart</button>
    </div>
    <div id="main-container">
      <div id="diagram-panel"><div id="diagram"></div></div>
      <div id="chart-panel">
        <div class="chart-header">
          <span id="chart-title">Segment Profile</span>
        </div>
        <div class="chart-hint" id="chart-hint">Hover over a segment (click to pin)</div>
        <div id="chart-area"></div>
      </div>
    </div>
  </div>
  <div id="tooltip" class="tooltip"></div>

  <script>
    // ============================================================
    // DATA (Python injects here)
    // ============================================================
    const D = JSON.parse('__INJECTED_DATA__');

    const W = 680, H = 940;
    const svg = d3.select("#diagram").append("svg")
      .attr("viewBox", `0 0 ${W} ${H}`)
      .attr("width", "100%")
      .attr("preserveAspectRatio", "xMidYMid meet");

    const defs = svg.append("defs");

    // ============================================================
    // Corticomedullary osmolality gradient background
    // ============================================================
    const stops = D.gradient_stops || [];
    if (stops.length >= 2) {
      const osmMin = d3.min(stops, d => d.osm);
      const osmMax = d3.max(stops, d => d.osm);
      const osmColor = d3.scaleSequential(d3.interpolateYlOrBr).domain([osmMin - 50, osmMax + 100]);

      const bgGrad = defs.append("linearGradient")
        .attr("id", "bg-osm-grad")
        .attr("x1", "0%").attr("y1", "0%").attr("x2", "0%").attr("y2", "100%");
      stops.forEach(s => {
        bgGrad.append("stop").attr("offset", `${s.frac * 100}%`).attr("stop-color", osmColor(s.osm));
      });
      svg.append("rect")
        .attr("x", 0).attr("y", 0).attr("width", W).attr("height", H)
        .attr("fill", "url(#bg-osm-grad)").attr("opacity", 0.35);

      const zoneBounds = [{ y: H * 0.27 }, { y: H * 0.55 }, { y: H * 0.56 }];
      zoneBounds.forEach(z => {
        svg.append("line")
          .attr("x1", 0).attr("y1", z.y).attr("x2", W).attr("y2", z.y)
          .attr("stroke", "#d4a574").attr("stroke-width", 0.8)
          .attr("stroke-dasharray", "6,4").attr("opacity", 0.5);
      });
      svg.append("text").attr("class", "zone-label").attr("x", 12).attr("y", 25).text("Cortex");
      svg.append("text").attr("class", "zone-label").attr("x", 12).attr("y", H * 0.28 + 18).text("Outer Medulla");
      svg.append("text").attr("class", "zone-label").attr("x", 12).attr("y", H * 0.57 + 18).text("Inner Medulla");

      const osmLegH = 300, osmLegX = W - 55, osmLegY = H * 0.35;
      const osmLegGrad = defs.append("linearGradient")
        .attr("id", "osm-leg-grad")
        .attr("x1", "0%").attr("y1", "0%").attr("x2", "0%").attr("y2", "100%");
      for (let i = 0; i <= 10; i++) {
        osmLegGrad.append("stop").attr("offset", `${i * 10}%`)
          .attr("stop-color", osmColor(osmMin + (osmMax - osmMin) * (i / 10)));
      }
      svg.append("rect")
        .attr("x", osmLegX).attr("y", osmLegY).attr("width", 12).attr("height", osmLegH)
        .attr("fill", "url(#osm-leg-grad)").attr("rx", 3).attr("opacity", 0.7);
      svg.append("text").attr("class", "osm-label").attr("x", osmLegX + 6).attr("y", osmLegY - 8).attr("text-anchor", "middle").text("mOsm");
      svg.append("text").attr("class", "osm-label").attr("x", osmLegX - 4).attr("y", osmLegY + 6).attr("text-anchor", "end").text(Math.round(osmMin));
      svg.append("text").attr("class", "osm-label").attr("x", osmLegX - 4).attr("y", osmLegY + osmLegH + 4).attr("text-anchor", "end").text(Math.round(osmMax));
    }

    // ============================================================
    // Anatomic nephron topology
    // ============================================================
    const topo = {
      "PT":   { pts: [[120,135],[140,120],[170,140],[200,125],[230,140],[255,128],[275,145]], baseW: 12 },
      "S3":   { pts: [[275,145],[275,175],[270,210],[268,250]], baseW: 10 },
      "SDL":  { pts: [[268,250],[265,310],[262,380],[260,440],[258,510]], baseW: 5 },
      "LDL":  { pts: [[258,510],[256,580],[255,650],[256,720],[260,780],[270,820],[285,840]], baseW: 5 },
      "LAL":  { pts: [[285,840],[300,830],[315,810],[325,770],[330,720],[332,650],[334,580],[336,510]], baseW: 6 },
      "mTAL": { pts: [[336,510],[338,440],[340,380],[342,310],[344,250]], baseW: 10 },
      "cTAL": { pts: [[344,250],[346,210],[348,175],[350,145]], baseW: 10 },
      "DCT":  { pts: [[350,145],[370,125],[395,140],[418,120],[440,140]], baseW: 9 },
      "CNT":  { pts: [[440,140],[460,130],[478,142]], baseW: 8 },
      "CCD":  { pts: [[478,142],[480,180],[482,220],[483,250]], baseW: 9 },
      "OMCD": { pts: [[483,250],[485,320],[487,400],[488,510]], baseW: 10 },
      "IMCD": { pts: [[488,510],[490,600],[492,700],[494,790],[495,870]], baseW: 12 },
    };

    const labelPos = {
      "PT":   { x: 190, y: 108, anchor: "middle" },
      "S3":   { x: 245, y: 195, anchor: "end" },
      "SDL":  { x: 238, y: 380, anchor: "end" },
      "LDL":  { x: 233, y: 680, anchor: "end" },
      "LAL":  { x: 355, y: 680, anchor: "start" },
      "mTAL": { x: 362, y: 380, anchor: "start" },
      "cTAL": { x: 374, y: 220, anchor: "start" },
      "DCT":  { x: 395, y: 108, anchor: "middle" },
      "CNT":  { x: 460, y: 118, anchor: "middle" },
      "CCD":  { x: 508, y: 195, anchor: "start" },
      "OMCD": { x: 510, y: 400, anchor: "start" },
      "IMCD": { x: 516, y: 750, anchor: "start" },
    };

    // ============================================================
    // Scales
    // ============================================================
    const flowMin = D.flow_min || 0.5, flowMax = D.flow_max || 100;
    const thickScale = d3.scaleLinear().domain([flowMin, flowMax]).range([3, 20]).clamp(true);

    const conMin = D.con_min || 0, conMax = D.con_max || 300;
    const conColor = d3.scaleSequential(d3.interpolateYlOrRd).domain([conMin, conMax]);

    const loadMin = D.load_min || 0, loadMax = D.load_max || 100;
    const loadColor = d3.scaleSequential(d3.interpolateViridis).domain([loadMin, loadMax]);

    // ============================================================
    // Glomerulus
    // ============================================================
    const glomG = svg.append("g").attr("transform", "translate(105, 120)");
    glomG.append("circle").attr("r", 22).attr("fill", "none").attr("stroke", "#dc2626").attr("stroke-width", 1.5).attr("opacity", 0.6);
    [[-4,-3,6],[5,-2,5],[0,5,5],[-6,4,4],[6,5,4]].forEach(([cx,cy,r]) => {
      glomG.append("circle").attr("cx",cx).attr("cy",cy).attr("r",r)
        .attr("fill", "#ef4444").attr("opacity", 0.5).attr("stroke", "#dc2626").attr("stroke-width", 0.5);
    });
    svg.append("text").attr("class", "glom-label").attr("x", 105).attr("y", 90).attr("text-anchor", "middle").text("Glomerulus");
    svg.append("text").attr("x", 65).attr("y", 118).attr("font-size", "9px").attr("fill", "#9ca3af").text("Aff →");
    svg.append("text").attr("x", 130).attr("y", 108).attr("font-size", "9px").attr("fill", "#9ca3af").text("→ Eff");

    // ============================================================
    // Segments (geometry FIXED; the color mode only changes the stroke)
    // ============================================================
    const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
    const tooltip = d3.select("#tooltip");

    const isJux = D.nephron_type && D.nephron_type.startsWith("jux");
    const drawSegs = Object.keys(topo).filter(s => {
      if ((s === "LDL" || s === "LAL") && !isJux) return false;
      return true;
    });

    // Pre-build the con + load gradients for each segment (not regenerated on mode change)
    function makeGrad(id, pts, scale, vEntry, vExit) {
      const g = defs.append("linearGradient").attr("id", id)
        .attr("gradientUnits", "userSpaceOnUse")
        .attr("x1", pts[0][0]).attr("y1", pts[0][1])
        .attr("x2", pts[pts.length-1][0]).attr("y2", pts[pts.length-1][1]);
      g.append("stop").attr("offset", "0%").attr("stop-color", scale(vEntry));
      g.append("stop").attr("offset", "100%").attr("stop-color", scale(vExit));
    }

    const segStore = {}; // segName -> {sw, hasCon, hasLoad}
    for (const seg of drawSegs) {
      const t = topo[seg];
      const segCon = D.segments ? D.segments[seg] : null;
      const segLoad = D.load ? D.load[seg] : null;
      const segFlow = D.flow ? D.flow[seg] : null;

      const sw = segFlow ? thickScale(segFlow.mean) : t.baseW;
      if (segCon)  makeGrad(`con-grad-${seg}`,  t.pts, conColor,  segCon.entry,  segCon.exit);
      if (segLoad) makeGrad(`load-grad-${seg}`, t.pts, loadColor, segLoad.entry, segLoad.exit);
      segStore[seg] = { sw, hasCon: !!segCon, hasLoad: !!segLoad };

      svg.append("path")
        .attr("class", "segment-path")
        .attr("id", `seg-path-${seg}`)
        .attr("data-seg", seg)
        .attr("d", lineGen(t.pts))
        .attr("fill", "none")
        .attr("stroke", segCon ? `url(#con-grad-${seg})` : "#d1d5db")
        .attr("stroke-width", sw)
        .attr("stroke-linecap", "round")
        .attr("stroke-linejoin", "round")
        .on("mouseover", function (event) {
          d3.select(this).attr("stroke-width", sw + 4);
          let html = `<div class='tt-title'>${seg}</div><hr>`;
          if (segCon) {
            html += `
              <div class='tt-row'><span class='tt-label'>Conc. inlet</span><span class='tt-val'>${segCon.entry.toFixed(1)} mM</span></div>
              <div class='tt-row'><span class='tt-label'>Conc. outlet</span><span class='tt-val'>${segCon.exit.toFixed(1)} mM</span></div>`;
          }
          if (segLoad) {
            html += `<hr>
              <div class='tt-row'><span class='tt-label'>Load inlet</span><span class='tt-val'>${segLoad.entry.toFixed(0)} pmol/min</span></div>
              <div class='tt-row'><span class='tt-label'>Load outlet</span><span class='tt-val'>${segLoad.exit.toFixed(0)} pmol/min</span></div>`;
          }
          if (segFlow) {
            html += `<hr>
              <div class='tt-row'><span class='tt-label'>Water flow (avg)</span><span class='tt-val'>${segFlow.mean.toFixed(1)} nl/min</span></div>`;
          }
          tooltip.html(html).style("opacity", 1)
            .style("left", (event.pageX + 18) + "px").style("top", (event.pageY - 30) + "px");
        })
        .on("mousemove", function (event) {
          tooltip.style("left", (event.pageX + 18) + "px").style("top", (event.pageY - 30) + "px");
        })
        .on("mouseout", function () {
          d3.select(this).attr("stroke-width", sw);
          tooltip.style("opacity", 0);
        });

      const lp = labelPos[seg];
      if (lp) {
        svg.append("text").attr("class", "seg-label")
          .attr("x", lp.x).attr("y", lp.y).attr("text-anchor", lp.anchor).text(seg);
      }
    }

    // ============================================================
    // Macula densa marker + TGF feedback link
    // ============================================================
    // Macula densa = the cortical end of cTAL (outlet, ~350,145), adjacent to the
    // vascular pole of its own glomerulus. TGF: a signal from this sensor back to the afferent arteriole.
    defs.append("marker").attr("id", "tgf-arrow")
      .attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5)
      .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto-start-reverse")
      .append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", "#b91c1c").attr("opacity", 0.55);

    svg.append("path")
      .attr("d", "M 348,150 C 300,250 150,250 74,128")
      .attr("fill", "none").attr("stroke", "#b91c1c").attr("stroke-width", 1.1)
      .attr("stroke-dasharray", "5,4").attr("opacity", 0.32)
      .attr("marker-end", "url(#tgf-arrow)");
    svg.append("text").attr("class", "tgf-label").attr("x", 205).attr("y", 235).attr("text-anchor", "middle").text("TGF →");

    svg.append("circle").attr("cx", 350).attr("cy", 146).attr("r", 4.5)
      .attr("fill", "#fde68a").attr("stroke", "#7c2d12").attr("stroke-width", 1.4);
    svg.append("text").attr("class", "md-label").attr("x", 350).attr("y", 132).attr("text-anchor", "middle").text("Macula Densa");

    // ============================================================
    // Flow particles (speed ∝ water flow); safe because geometry is fixed
    // ============================================================
    const durScale = d3.scaleLinear().domain([flowMin, flowMax]).range([7.0, 2.2]).clamp(true);
    const particleG = svg.append("g").attr("id", "particles").attr("class", "particle");
    let particlesOn = true;
    for (const seg of drawSegs) {
      const segFlow = D.flow ? D.flow[seg] : null;
      if (!segFlow) continue;
      const dur = durScale(segFlow.mean);
      const n = 3;
      for (let i = 0; i < n; i++) {
        const c = particleG.append("circle")
          .attr("r", 2.1).attr("fill", "#ffffff")
          .attr("stroke", "#1e3a8a").attr("stroke-width", 0.5).attr("opacity", 0.9);
        const am = c.append("animateMotion")
          .attr("dur", dur + "s").attr("repeatCount", "indefinite")
          .attr("begin", (-(i * dur / n)) + "s");
        am.append("mpath").attr("href", `#seg-path-${seg}`).attr("xlink:href", `#seg-path-${seg}`);
      }
    }

    // ============================================================
    // Color legend (redrawn per mode)
    // ============================================================
    function renderColorLegend() {
      svg.select("#color-legend").remove();
      const isLoad = (colorMode === "load");
      const vmin = isLoad ? loadMin : conMin;
      const vmax = isLoad ? loadMax : conMax;
      const sc   = isLoad ? loadColor : conColor;
      const title = isLoad ? `${D.solute} Load (pmol/min)` : `${D.solute} Concentration (mM)`;
      const gid = isLoad ? "leg-grad-load" : "leg-grad-con";
      if (defs.select(`#${gid}`).empty()) {
        const lg = defs.append("linearGradient").attr("id", gid);
        for (let i = 0; i <= 10; i++) {
          lg.append("stop").attr("offset", `${i*10}%`).attr("stop-color", sc(vmin + (vmax - vmin) * i / 10));
        }
      }
      const cLegW = 160, cLegH = 12;
      const g = svg.append("g").attr("id", "color-legend").attr("transform", `translate(${W - 220}, 20)`);
      g.append("rect").attr("width", cLegW).attr("height", cLegH).attr("fill", `url(#${gid})`).attr("rx", 3);
      g.append("text").attr("class", "legend-title").attr("y", -6).text(title);
      g.append("text").attr("class", "legend-tick").attr("y", cLegH + 12).text(vmin.toFixed(0));
      g.append("text").attr("class", "legend-tick").attr("x", cLegW).attr("y", cLegH + 12).attr("text-anchor", "end").text(vmax.toFixed(0));
    }

    // Thickness legend (always water flow)
    const fLeg = svg.append("g").attr("transform", `translate(${W - 220}, 58)`);
    fLeg.append("text").attr("class", "legend-title").attr("y", -4).text("Thickness ∝ Water Flow (nl/min)");
    fLeg.append("line").attr("x1", 0).attr("y1", 10).attr("x2", 30).attr("y2", 10)
      .attr("stroke", "#9ca3af").attr("stroke-width", 3).attr("stroke-linecap", "round");
    fLeg.append("text").attr("class", "legend-tick").attr("x", 35).attr("y", 14).text(flowMin.toFixed(1));
    fLeg.append("line").attr("x1", 90).attr("y1", 10).attr("x2", 120).attr("y2", 10)
      .attr("stroke", "#9ca3af").attr("stroke-width", 14).attr("stroke-linecap", "round");
    fLeg.append("text").attr("class", "legend-tick").attr("x", 128).attr("y", 14).text(flowMax.toFixed(1));

    svg.append("text").attr("x", 495).attr("y", H - 40)
      .attr("font-size", "10px").attr("fill", "#92400e").attr("text-anchor", "middle").text("↓ Urine");

    // ============================================================
    // Color mode (concentration ↔ load)
    // ============================================================
    let colorMode = "con";
    function applyMode(mode) {
      colorMode = mode;
      for (const seg of drawSegs) {
        const has = (mode === "load") ? segStore[seg].hasLoad : segStore[seg].hasCon;
        svg.select(`path[data-seg='${seg}']`).attr("stroke", has ? `url(#${mode}-grad-${seg})` : "#d1d5db");
      }
      renderColorLegend();
      d3.select("#mode-btn").text(mode === "load" ? "Color: Load (flux)" : "Color: Concentration");
      if (chartOpen) drawChart(highlightOrPinned());
    }
    d3.select("#mode-btn").on("click", () => applyMode(colorMode === "con" ? "load" : "con"));

    d3.select("#flow-btn").on("click", function () {
      particlesOn = !particlesOn;
      particleG.attr("display", particlesOn ? null : "none");
      d3.select(this).text(particlesOn ? "Flow: On" : "Flow: Off");
    });

    // ============================================================
    // CHART PANEL: synchronized profile + click-to-pin
    // ============================================================
    const chartPanel = d3.select("#chart-panel");
    const chartArea = d3.select("#chart-area");
    const chartTitle = d3.select("#chart-title");
    const chartHint = d3.select("#chart-hint");
    const diagramPanel = d3.select("#diagram-panel");
    let chartOpen = false;
    let pinnedSeg = null;
    let hoverSeg = null;

    function activeData() { return colorMode === "load" ? (D.load || {}) : (D.segments || {}); }
    function activeUnit() { return colorMode === "load" ? "pmol/min" : "mM"; }
    function activeName() { return colorMode === "load" ? `${D.solute} load` : `${D.solute}`; }
    function highlightOrPinned() { return hoverSeg || pinnedSeg; }

    const segOrder = ["PT","S3","SDL","LDL","LAL","mTAL","cTAL","DCT","CNT","CCD","OMCD","IMCD"];
    const segColors = {
      "PT":"#2563eb", "S3":"#3b82f6", "SDL":"#06b6d4", "LDL":"#0891b2",
      "LAL":"#0d9488", "mTAL":"#059669", "cTAL":"#10b981", "DCT":"#d97706",
      "CNT":"#f59e0b", "CCD":"#dc2626", "OMCD":"#be185d", "IMCD":"#7c3aed"
    };

    function setHint() {
      if (pinnedSeg) {
        chartHint.style("display", "block").text(`Pinned: ${pinnedSeg} — click again to remove`);
      } else {
        chartHint.style("display", "block").text("Hover over a segment · click to pin");
      }
    }

    function updatePinUI() {
      svg.selectAll(".segment-path").style("filter", null);
      if (pinnedSeg) {
        svg.select(`path[data-seg='${pinnedSeg}']`).style("filter", "drop-shadow(0 0 5px rgba(30,58,138,0.9))");
      }
      setHint();
    }

    function openChart(state) {
      chartOpen = state;
      chartPanel.classed("open", state);
      diagramPanel.classed("shrunk", state);
      d3.select("#toggle-chart-btn").text(state ? "Close chart" : "Open chart");
      if (state) drawChart(highlightOrPinned());
    }
    d3.select("#toggle-chart-btn").on("click", () => openChart(!chartOpen));

    function drawChart(highlightSeg) {
      chartArea.selectAll("*").remove();
      const data = activeData();
      const segsWithProfile = segOrder.filter(s => data[s] && data[s].profile);
      if (segsWithProfile.length === 0) {
        chartTitle.text("No data");
        return;
      }

      let cumX = 0;
      const segRanges = {};
      segsWithProfile.forEach(s => { segRanges[s] = { x0: cumX, x1: cumX + 1 }; cumX += 1; });

      const cM = { top: 20, right: 20, bottom: 36, left: 56 };
      const cW = 620 - cM.left - cM.right;
      const cH = 220 - cM.top - cM.bottom;

      const chartSvg = chartArea.append("svg")
        .attr("viewBox", `0 0 ${cW + cM.left + cM.right} ${cH + cM.top + cM.bottom}`)
        .attr("width", "100%").attr("preserveAspectRatio", "xMidYMid meet")
        .append("g").attr("transform", `translate(${cM.left},${cM.top})`);

      const xScale = d3.scaleLinear().domain([0, cumX]).range([0, cW]);

      let allVals = [];
      segsWithProfile.forEach(s => data[s].profile.forEach(([p, v]) => allVals.push(v)));
      const yMin = d3.min(allVals) * 0.95;
      const yMax = d3.max(allVals) * 1.05;
      const yScale = d3.scaleLinear().domain([yMin, yMax]).range([cH, 0]);

      segsWithProfile.forEach((s, i) => {
        const r = segRanges[s];
        chartSvg.append("rect")
          .attr("x", xScale(r.x0)).attr("y", 0)
          .attr("width", xScale(r.x1) - xScale(r.x0)).attr("height", cH)
          .attr("fill", i % 2 === 0 ? "#f9fafb" : "#f3f4f6")
          .attr("opacity", highlightSeg === s ? 0.0 : 1.0);
      });

      if (highlightSeg && segRanges[highlightSeg]) {
        const hr = segRanges[highlightSeg];
        chartSvg.append("rect")
          .attr("x", xScale(hr.x0)).attr("y", 0)
          .attr("width", xScale(hr.x1) - xScale(hr.x0)).attr("height", cH)
          .attr("fill", segColors[highlightSeg] || "#2563eb").attr("opacity", 0.08);
      }

      segsWithProfile.forEach(s => {
        const r = segRanges[s];
        const lineData = data[s].profile.map(([p, v]) => [xScale(r.x0 + p), yScale(v)]);
        const isHighlighted = (highlightSeg === s);
        const isAny = !!highlightSeg;
        chartSvg.append("path")
          .attr("d", d3.line().curve(d3.curveCatmullRom.alpha(0.3))(lineData))
          .attr("fill", "none")
          .attr("stroke", segColors[s] || "#6b7280")
          .attr("stroke-width", isHighlighted ? 3.5 : 1.5)
          .attr("opacity", isAny ? (isHighlighted ? 1 : 0.35) : 0.7);
      });

      segsWithProfile.forEach(s => {
        const r = segRanges[s];
        const midX = xScale((r.x0 + r.x1) / 2);
        chartSvg.append("text")
          .attr("x", midX).attr("y", cH + 24).attr("text-anchor", "middle")
          .attr("font-size", "9px")
          .attr("font-weight", highlightSeg === s ? "700" : "400")
          .attr("fill", highlightSeg === s ? (segColors[s] || "#111") : "#9ca3af")
          .text(s);
      });

      const yAxis = d3.axisLeft(yScale).ticks(6).tickSize(-cW);
      chartSvg.append("g").call(yAxis)
        .call(g => g.selectAll(".tick line").attr("stroke", "#e5e7eb").attr("stroke-dasharray", "2,2"))
        .call(g => g.selectAll(".tick text").attr("font-size", "9px").attr("fill", "#6b7280"))
        .call(g => g.select(".domain").remove());

      chartSvg.append("text")
        .attr("transform", "rotate(-90)").attr("x", -cH/2).attr("y", -44)
        .attr("text-anchor", "middle").attr("font-size", "10px").attr("fill", "#374151").attr("font-weight", "600")
        .text(`${activeName()} (${activeUnit()})`);

      if (highlightSeg) {
        chartTitle.text(`${highlightSeg} — ${activeName()} profile`);
      } else {
        chartTitle.text(`All segments — ${activeName()}`);
      }
    }

    // Segment interactions: hover preview + click pin
    svg.selectAll(".segment-path")
      .on("mouseover.chart", function () {
        hoverSeg = d3.select(this).attr("data-seg");
        if (chartOpen) drawChart(hoverSeg);
      })
      .on("mouseout.chart", function () {
        hoverSeg = null;
        if (chartOpen) drawChart(pinnedSeg);
      })
      .on("click", function () {
        const seg = d3.select(this).attr("data-seg");
        if (!chartOpen) openChart(true);
        pinnedSeg = (pinnedSeg === seg) ? null : seg;
        updatePinUI();
        drawChart(pinnedSeg);
      });

    // ============================================================
    // Initial draw
    // ============================================================
    applyMode("con");
    setHint();

    // Segment handed over from the app's shared selection: start with it pinned (highlighted)
    if (D.focus && segStore[D.focus]) {
      pinnedSeg = D.focus;
      updatePinUI();
    }
  </script>
</body>
</html>
